[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spp"
version = "0.1.0"
description = "News-sentiment driven stock return prediction (research scaffold)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "yfinance>=0.2.40",
    "datasets>=2.19",
    "transformers>=4.40",
    "torch>=2.2",
    "onnxruntime>=1.17",
    "feedparser>=6.0",
    "requests>=2.31",
    "pydantic>=2.6",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "pandas_market_calendars>=4.4",
    "pysentiment2>=0.1.1",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "ipykernel"]

[project.scripts]
spp = "spp.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["spp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# `src/spp/data/` was invisible to ruff until `.gitignore` stopped excluding it
# (the old `data/` pattern also matched the package). Its long log and docstring lines
# are waived rather than reformatted in bulk; every other rule still applies.
[tool.ruff.lint.per-file-ignores]
"src/spp/data/*.py" = ["E501"]
